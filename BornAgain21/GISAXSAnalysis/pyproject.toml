[project]
name = "GISAXS_Analysis"
version = "0.1.0"
description = "Helpers for BornAgain simulations and data analysis"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "numpy ~=1.26.4",
  "scipy ~=1.15.2",
  "pandas ~=2.2.3",
  "matplotlib ~=3.10.1",
  "bornagain ==21.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
